spring.application.name=measurement

# --- Database (H2 in-memory for dev/test) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Logging ---
logging.level.root=INFO
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# --- H2 Console (optional) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Default Spring Security user (only for dev/basic auth) ---
spring.security.user.name=admin
spring.security.user.password=admin123

# --- Google OAuth2 Client ---
spring.security.oauth2.client.registration.google.client-id=430035853828-ludrmjliso6g0lb3mquas87snsut588b.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# --- JWT Settings ---
# Must be at least 32 bytes (256 bits) for HS256
app.jwt.secret=mysuperlongsecretkeythatismorethan32bytes1234567890secure
app.jwt.expiration=86400000

# --- Public paths (allowed without authentication) ---
app.security.public-paths=/api/auth/**,/swagger-ui/**,/v3/api-docs/**,/actuator/health