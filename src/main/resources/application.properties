spring.application.name=measurement
# UC16 Application Properties
# Default: H2 in-memory DB for dev/test

db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
db.poolSize=5

# Logging
logging.level.root=INFO
logging.level.com.quantity.measurement=DEBUG

# === MySQL/PostgreSQL (future use) ===
# Uncomment and adjust if migrating to production DB

# MySQL Example:
# db.url=jdbc:mysql://localhost:3306/quantitydb
# db.user=root
# db.password=secret

# PostgreSQL Example:
# db.url=jdbc:postgresql://localhost:5432/quantitydb
# db.user=postgres
# db.password=secret
